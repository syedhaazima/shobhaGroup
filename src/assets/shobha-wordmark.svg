<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shobha Group wordmark</title>
  <desc id="desc">Gold decorative wordmark for the Shobha Group brand.</desc>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C79239"/>
      <stop offset="18%" stop-color="#F1D79A"/>
      <stop offset="43%" stop-color="#D4AF6A"/>
      <stop offset="65%" stop-color="#F8E9BE"/>
      <stop offset="100%" stop-color="#B8842E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <text
      x="25"
      y="220"
      font-size="250"
      font-family="Georgia, 'Times New Roman', serif"
      font-weight="700"
      font-style="italic"
      letter-spacing="-16"
      fill="url(#goldGradient)"
      stroke="#0A0A0A"
      stroke-width="11"
      paint-order="stroke fill"
    >SHOBHA</text>
  </g>
</svg>
